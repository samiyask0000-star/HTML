<!--Margin provide external spacing to an element. It is used to create space between elements.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #p1{
            border: 5px solid red;
            margin: 20px 60px;
        }
        #p2{
            border: 5px solid rgb(59, 72, 191);
            margin: 20px 60px 20px 60px;    
        }
        #p3{
            border: 5px solid rgb(59, 208, 96);
            margin: 20px 60px 20px 60px;    
        }
        </style>
</head>
<body>
    <p id="p1">This is a paragraph with margin.</p>
    <p id="p2">Hello world</p>
    <p id="p3">This is a paragraph with margin.</p>
</body>
</html>
