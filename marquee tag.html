<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .blink{
            animation: blink 1s linear infinite;
            color: sandybrown;
        }
        @keyframes blink{
            0%{
                opacity: 1;
            }
            50%{
                opacity: 0;
            }
            100%{
                opacity: 1;
            }
        }
        </style>
</head>
<body>
    <!--<marquee> tag  is used to create a scrolling text effect across the  web page -->
        <marquee width="100%" height="50"   direction="left" scrollamount="20">
            This is a scrolling text
        </marquee>
        <marquee width="100%" height="50" direction="right" scrollamount="1">
            This is a scrolling text
        </marquee>
        <marquee width="100%" height="50" direction="up" scrollamount="50">
            This is a scrolling text
        </marquee>
        <marquee width="100%" height="50" direction="down" scrollamount="100">
            This is a scrolling text
        </marquee>
        <marquee class="blink">
            This is a scrolling text
        </marquee>


</body>
</html>
