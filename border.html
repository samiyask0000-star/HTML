<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
        p.none{
            border-style: none;
        }
        p.dotted{
            border-style: dotted;
        }
        p.dashed{
            border-style: dashed;
        }
        p.solid{
            border-style: solid;
        }
        p.double{
            border-style: double;
        }
        p.groove{
            border-style: groove;
        }
        p.ridge{
            border-style: ridge;
        }
        p.inset{
            border-style: inset;
        }
        p.outset{
            border-style: outset;
        }
        </style>
</head>
<body>
    <p class="none">This is a paragraph.</p>
    <p class="dotted">This is a paragraph.</p>
    <p class="dashed">This is a paragraph.</p>
    <p class="solid">This is a paragraph.</p>
    <p class="double">This is a paragraph.</p>
    <p class="groove">This is a paragraph.</p>
    <p class="ridge">This is a paragraph.</p>
    <p class="inset">This is a paragraph.</p>
    <p class="outset">This is a paragraph.</p>
    
</body>

</html>
