<!--css selector:css selector is used to select the HTML element based on their id, class, type, attribute, etc.-->
<!--there are 5 types of css selector:1.universal selector 2.type selector 3.class selector 4.id selector 5.attribute selector-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{

       

            background-color: rgb(245, 238, 238);
            color: rgb(151, 20, 20);
            font-size: 24px;
        }
        h3{
            background-color: lightblue;
            color: white;
            font-size: 24px;
        }
        #idselector{
            background-color: lightgreen;
            color: white;
            font-size: 24px;
        }
        .classselector{
            background-color: lightcoral;
            color: white;
            font-size: 24px;
        }
        h1,p,h4{
           font-family: 'Courier New', Courier, monospace;
        }
    
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>there are 5 types of css selector:1.universal selector 2.type selector 3.class selector 4.id selector 5.attribute selector</p>
    <!--element selector target the element based on the specific element-->
    <h3>This is a heading.</h3>
    <!--id selector target the element based on the specific id-->
    <h4 id="idselector">This is a subheading.</h4>
    <!--class selector target the element based on the specific class-->
    <h5 class="classselector">This is a class selector.</h5>
    <!--group selector is used to minimize the code ","is used to -->
    <h6>This is a group selector.</h6>
</body>
</html>
